# ~/.config/kitty/kitty.conf
# Rice: minimalista + pixel art (Spleen)
# Colores: generados por matugen a partir del wallpaper (include de abajo)

font_family              Spleen 8x16
bold_font                auto
italic_font              auto
font_size                16

# Tema generado por matugen (colores del wallpaper actual)
include themes/Matugen.conf

# Transparencia (niri compone buffers alfa)
background_opacity        0.88
dynamic_background_opacity yes

cursor_shape             block
cursor_blink_interval    0

scrollback_lines         20000
window_padding_width     6
confirm_os_window_close  0
