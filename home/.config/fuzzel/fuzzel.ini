# ~/.config/fuzzel/fuzzel.ini
# Launcher con estética de menú de selección de videojuego.
[main]
include=~/.config/fuzzel/colors.ini
font=Spleen 8x16
prompt="SELECT PROGRAM > "
placeholder="TYPE TO SEARCH..."
icon-theme=pixora-dark
icons-enabled=yes
terminal=kitty
lines=10
width=46
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=24
match-counter=yes
anchor=center

[border]
width=2
radius=0
